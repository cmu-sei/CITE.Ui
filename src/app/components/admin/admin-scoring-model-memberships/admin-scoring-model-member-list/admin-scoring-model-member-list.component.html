<div class="mat-elevation-z8">
  <mat-toolbar class="background">
    <mat-toolbar-row>
      <mat-icon class="mdi-24px" fontIcon="mdi-account-multiple" />
      <p>ScoringModel Members</p>
    </mat-toolbar-row>
    <mat-toolbar-row>
      <mat-form-field class="w-50">
        <input matInput [(ngModel)]="filterString" (keyup)="applyFilter($event)" #input autocomplete="off"
          placeholder="Search" />
          @if (filterString) {
            <button matSuffix mat-icon-button aria-label="Clear" (click)="clearFilter()">
              <mat-icon class="mdi-24px" fontIcon="mdi-close-circle-outline" />
            </button>
          }
        </mat-form-field>
        <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" aria-label="Select page of members" />
      </mat-toolbar-row>
    </mat-toolbar>
    <table mat-table matSort matSortActive="name" matSortDirection="asc" [dataSource]="dataSource" class="w-100">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let model">
          {{ model.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
        <td mat-cell *matCellDef="let model">
          {{ model.type }}
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
        <td mat-cell *matCellDef="let model">
          <mat-select [disabled]="!canEdit()" [value]="model.membership.roleId"
            (selectionChange)="updateRole(model.membership.id, $event)">
            @for (role of roles(); track trackById($index, role)) {
              <mat-option [value]="role.id">{{ role.name }}</mat-option>
            }
          </mat-select>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let model">
          <button mat-icon-button matTooltip="Remove {{ model.name }}" (click)="delete(model.membership.id)"
            [disabled]="!canEdit()">
            <mat-icon class="mdi-24px self-center" fontIcon="mdi-minus-circle-outline" />
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">
          @if (input.value) {
            No results found
          } @else {
            This ScoringModel currently has no members
          }
        </td>
      </tr>
    </table>
  </div>
