<div class="mat-elevation-z8 m-2">
  <table mat-table [dataSource]="dataSource" class="w-100">
    <ng-container matColumnDef="permissions">
      <th mat-header-cell *matHeaderCellDef>Permissions</th>
      <td mat-cell *matCellDef="let permission">
        <button mat-icon-button color="primary" [matTooltip]="permissionMap.get(permission)" [matTooltipShowDelay]="0"
          [attr.aria-label]="'About ' + permission">
          <mat-icon class="mdi-24px" fontIcon="mdi-information" />
        </button>
        {{ permission }}
      </td>
    </ng-container>

    @for (role of roles$ | async; track role.id) {
      <ng-container [matColumnDef]="role.id">
        <th mat-header-cell *matHeaderCellDef>
          <div class="d-flex">
            <p>{{ role.name }}</p>
          </div>
        </th>
        <td mat-cell *matCellDef="let permission">
          <mat-checkbox color="primary" [checked]="hasPermission(permission, role)" disabled="true"
            [aria-label]="role.name + ' ' + permission" />
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns$ | async; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns$ | async"></tr>
  </table>
</div>
