<div [class]="getTopClass()">
  <!--
    Angular refuses a bound sandbox, so each sandbox is its own frame. Neither
    frame may navigate the CITE page or open alerts.
  -->
  @if (refusedUrl) {
    <p class="refused-url" role="status">
      The scoring model's embedded URL isn't a full http:// or https:// address,
      so it isn't shown.
    </p>
  } @else if (sameOrigin) {
    <!--
      A page on CITE's own origin may run scripts but gets an opaque origin, so
      it can't reach CITE or lift its sandbox, nor can its popups.
    -->
    <iframe
      title="focused app"
      allow="fullscreen"
      sandbox="allow-scripts allow-forms allow-popups allow-downloads"
      class="focused-app-iframe"
      [src]="safeUrl"
      aria-label="Focused Application"
    ></iframe>
  } @else {
    <!--
      A dashboard or document on another origin keeps that origin and may run
      scripts, so it can sign in, with the Storage Access API if it needs its
      cookies in a frame; being another origin, it still can't reach CITE.
    -->
    <iframe
      title="focused app"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-storage-access-by-user-activation"
      class="focused-app-iframe"
      [src]="safeUrl"
      aria-label="Focused Application"
    ></iframe>
  }
</div>
